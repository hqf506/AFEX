apply plugin: 'com.android.application'

def readSigningValue = { String key ->
    def propertyValue = project.findProperty(key)
    if (propertyValue != null && propertyValue.toString().trim()) {
        return propertyValue.toString()
    }

    def environmentValue = System.getenv(key)
    if (environmentValue != null && environmentValue.trim()) {
        return environmentValue
    }

    return null
}

def afexReleaseStoreFile = file(readSigningValue('AFEX_POS_RELEASE_STORE_FILE') ?: '../afex-pos-release-key.jks')
def afexReleaseStorePassword = readSigningValue('AFEX_POS_RELEASE_STORE_PASSWORD')
def afexReleaseKeyAlias = readSigningValue('AFEX_POS_RELEASE_KEY_ALIAS') ?: 'afex-pos'
def afexReleaseKeyPassword = readSigningValue('AFEX_POS_RELEASE_KEY_PASSWORD')

android {
    namespace = "com.afex.pos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.afex.pos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [usesCleartextTraffic: "false"]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile afexReleaseStoreFile
            storePassword afexReleaseStorePassword
            keyAlias afexReleaseKeyAlias
            keyPassword afexReleaseKeyPassword
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            signingConfig signingConfigs.release
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseBuildRequested = taskGraph.allTasks.any { task ->
        task.name.toLowerCase().contains('release')
    }

    if (!releaseBuildRequested) {
        return
    }

    if (!afexReleaseStoreFile.exists()) {
        throw new GradleException("AFEX release keystore was not found at ${afexReleaseStoreFile}. Set AFEX_POS_RELEASE_STORE_FILE if it lives elsewhere.")
    }

    if (!afexReleaseStorePassword || !afexReleaseKeyPassword) {
        throw new GradleException("AFEX release signing passwords are missing. Set AFEX_POS_RELEASE_STORE_PASSWORD and AFEX_POS_RELEASE_KEY_PASSWORD as environment variables or Gradle properties.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
