<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Reports Filters Cleaned Preview</title>
  <style>
    body { margin:0; background:#f8fafc; font-family:Tahoma, Arial, sans-serif; }
    .frame { width: 1360px; margin: 0 auto; padding: 40px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:24px; box-shadow:0 10px 25px rgba(15,23,42,.06); padding:28px; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:20px; }
    .title { font-size:18px; font-weight:700; color:#0f172a; }
    .desc { margin-top:6px; color:#64748b; font-size:14px; }
    .meta { margin-top:10px; color:#94a3b8; font-size:12px; }
    .actions { display:flex; gap:8px; }
    .btn { border:1px solid #e5e7eb; background:#fff; color:#000; border-radius:12px; padding:10px 16px; font-size:14px; font-weight:600; }
    .grid { display:grid; grid-template-columns: 1.35fr 1.1fr 0.9fr 0.9fr 0.9fr auto; gap:20px; align-items:end; }
    .label { font-size:14px; font-weight:700; color:#334155; margin-bottom:8px; display:block; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; border:1px solid #e2e8f0; background:#fff; color:#334155; }
    .chip.active { background:#000; color:#fff; border-color:#000; }
    .field { height:44px; border:1px solid #e2e8f0; border-radius:12px; background:#fff; padding:0 16px; display:flex; align-items:center; justify-content:space-between; color:#334155; font-size:14px; }
    .field.disabled { background:#f8fafc; color:#94a3b8; opacity:.7; cursor:not-allowed; }
    .apply { height:44px; border:none; border-radius:12px; background:#000; color:#fff; font-size:14px; font-weight:700; padding:0 18px; }
    .footer { margin-top:20px; display:flex; justify-content:flex-end; }
    .badge { background:#f1f5f9; color:#475569; border-radius:999px; padding:6px 12px; font-size:12px; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="top">
        <div class="actions">
          <button class="btn">تصدير PDF</button>
          <button class="btn">تصدير Excel</button>
        </div>
        <div>
          <div class="title">فلاتر التقرير</div>
          <div class="desc">اختر نوع التقرير وحدد الفترة الزمنية ثم طبّق النتائج</div>
          <div class="meta">آخر تحديث: 14:25:10</div>
        </div>
      </div>

      <div class="grid">
        <div>
          <label class="label">الفترة</label>
          <div class="chips">
            <div class="chip active">يوم</div>
            <div class="chip">شهر</div>
            <div class="chip">أسبوع</div>
            <div class="chip">مخصص</div>
          </div>
        </div>

        <div>
          <label class="label">الفرع</label>
          <div class="field"><span>▾</span><span>فرع Leather-Fix</span></div>
        </div>

        <div>
          <label class="label">من تاريخ</label>
          <div class="field disabled"><span>🗓</span><span>2026-04-27</span></div>
        </div>

        <div>
          <label class="label">إلى تاريخ</label>
          <div class="field disabled"><span>🗓</span><span>2026-04-27</span></div>
        </div>

        <div>
          <label class="label">تطبيق</label>
          <button class="apply">تطبيق</button>
        </div>
      </div>

      <div class="footer">
        <span class="badge">الصلاحية: مدير النظام</span>
      </div>
    </div>
  </div>
</body>
</html>
