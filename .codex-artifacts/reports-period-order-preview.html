<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Reports Period Order Preview</title>
  <style>
    body { margin:0; background:#f8fafc; font-family:Tahoma, Arial, sans-serif; }
    .frame { width: 1100px; margin: 0 auto; padding: 40px; }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:24px; box-shadow:0 10px 25px rgba(15,23,42,.06); padding:28px; }
    .label { font-size:14px; font-weight:700; color:#334155; margin-bottom:12px; display:block; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip { padding:10px 16px; border-radius:12px; font-size:14px; font-weight:600; border:1px solid #e2e8f0; background:#fff; color:#334155; }
    .chip.active { background:#000; color:#fff; border-color:#000; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <label class="label">الفترة</label>
      <div class="chips">
        <div class="chip active">يوم</div>
        <div class="chip">أسبوع</div>
        <div class="chip">شهر</div>
        <div class="chip">مخصص</div>
      </div>
    </div>
  </div>
</body>
</html>
