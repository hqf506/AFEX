[databases]
afex_a25_pd6 = host=pd6f-postgres-backend port=5432 dbname=afex_a25_pd6

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
pool_mode = transaction
auth_type = scram-sha-256
auth_file = /run/secrets/userlist.txt
max_client_conn = 8
default_pool_size = 2
min_pool_size = 0
reserve_pool_size = 0
max_prepared_statements = 0
server_reset_query = DISCARD ALL
server_reset_query_always = 0
client_tls_sslmode = disable
server_tls_sslmode = disable
admin_users =
stats_users =
